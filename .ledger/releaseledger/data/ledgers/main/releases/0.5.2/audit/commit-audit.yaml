    observed_behavior:
      Added Studio endpoints for normalized engine-model inventory and status, plus
      queued install, update, verify, and remove operations. A single worker serializes
      operations, cache mutations are blocked during active audiobook jobs, and
      operation responses expose normalized results and errors. Readio minimum is raised
      to 0.6.9 and the Studio extra no longer bundles a synthesis engine. Documentation,
      API schema, and tests cover the changes.
