[codecrate]
output = "context_ttsforge.md"
keep_docstrings = true
dedupe = false
metadata = false
manifest = false
respect_gitignore = true
exclude = [
  "*/.venv/*",
  ".sample-*",
  "context_ttsforge.*",
  "reconstructed",
  "reconstructed/**",
  "**/reconstructed/**",
  "codecrate-pack.log",
]
gitignore_allow = ["ttsforge/_version.py"]
include = [
  "**/*.py",
  "**/*.toml",
  "**/*.md",
  "**/*.json",
  "**/*.txt",
  "**/*.csv",
  "**/*.tsv",
  "**/*.yaml",
  "**/*.yml",
  "LICENSE",
]
split_max_chars = 0
layout = "full"
profile = "portable-agent"
emit_standalone_unpacker = true
