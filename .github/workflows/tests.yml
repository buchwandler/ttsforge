name: Run TTSForge tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: ttsforge
      - uses: actions/checkout@v4
        with:
          repository: buchwandler/readio
          ref: main
          path: readio
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packages against Readio's public API source
        working-directory: ttsforge
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ../readio
          python -m pip install -e ".[dev]"
      - name: Lint
        working-directory: ttsforge
        run: ruff check ttsforge tests
      - name: Test
        working-directory: ttsforge
        run: pytest -q
