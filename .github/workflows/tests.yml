name: Run tests
on:
  push:
  pull_request:
jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Typer compatibility version (Python 3.10)
      if: matrix.python-version == '3.10'
      run: python -m pip install "typer<0.27.0"
    - name: Install espeak-ng (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y espeak-ng  ffmpeg
    - name: Install espeak-ng (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install espeak-ng ffmpeg
    - name: Install espeak-ng (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        choco install espeak-ng ffmpeg-full --yes --no-progress
        $espeak = Get-Command espeak-ng.exe -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $espeak) {
          $espeak = Get-ChildItem -Path @($env:ProgramFiles, ${env:ProgramFiles(x86)}) -Filter espeak-ng.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        }
        if (-not $espeak) {
          throw "eSpeak NG executable was not found after installation"
        }
        $espeakPath = if ($espeak.Source) { $espeak.Source } else { $espeak.FullName }
        $espeakDirectory = Split-Path -Parent $espeakPath
        $espeakDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & $espeakPath --version
    - name: Install packages
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[cpu]"
        python -m pip install -r requirements-test.txt
        python -m pip install spacy
        python -m spacy download en_core_web_sm
        python -m lexphon data install en-us:gold
        pytest

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install Typer compatibility version
      run: python -m pip install "typer<0.27.0"
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y espeak-ng ffmpeg
    - name: Install exact minimum generation stack
      run: |
        python -m pip install --upgrade pip
        python -m pip install \
          "kokorog2p[espeak,en]==0.9.5" \
          "pykokoro[cpu]==0.9.4" \
          "phrasplit==0.3.7" \
          "ssmd==0.8.7"
        python -m pip install -e ".[dev]"
    - name: Install kokorog2p lexicon data
      run: python -m lexphon data install en-us:gold
    - name: Verify exact minimum versions
      run: |
        python - <<'PY'
        from importlib.metadata import version

        assert version("kokorog2p") == "0.9.5", version("kokorog2p")
        assert version("pykokoro") == "0.9.4", version("pykokoro")
        assert version("phrasplit") == "0.3.7", version("phrasplit")
        assert version("ssmd") == "0.8.7", version("ssmd")
        print("kokorog2p", version("kokorog2p"))
        print("pykokoro", version("pykokoro"))
        print("phrasplit", version("phrasplit"))
        print("ssmd", version("ssmd"))
        PY
    - name: Run minimum dependency contract tests
      run: |
        pytest -q \
          tests/test_packaging.py \
          tests/test_dependency_contract.py \
          tests/test_pykokoro_unit_contract.py \
          tests/test_kokoro_runner.py \
          tests/test_name_extractor.py \
          tests/test_resume_identity.py \
          tests/test_resume_integrity.py \
          tests/test_phoneme_dictionary.py \
          tests/test_tokenizer.py
