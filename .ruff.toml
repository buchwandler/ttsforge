
target-version = "py310"
fix = false

[lint]
extend-select = [
    "B",
    "C90",
    "E501",  # line too long (default 88)
    "I",  # isort
    "UP",  # pyupgrade
]
exclude = ["setup/*", "notebooks/*", "context_*.py"]

[format]
exclude = ["setup/*", "notebooks/*", "context_*.py"]

[lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]  # ignore unused and unsorted imports in __init__.py
"__manifest__.py" = ["B018"]  # useless expression
# Transitional baseline for the review's explicitly deferred command
# decomposition. Keep the ignore scoped to the oversized current modules.
"ttsforge/cli/commands_*.py" = ["C901"]
"ttsforge/conversion.py" = ["C901"]
"ttsforge/phoneme_conversion.py" = ["C901"]

[lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[lint.mccabe]
max-complexity = 22
